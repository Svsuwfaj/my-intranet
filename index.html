<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 사 쿠 라 조직 인트라넷</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { 
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%); 
            color: #334155; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .card { 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 35px; 
            border: 1px solid #fbcfe8; 
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.15); 
            width: 100%; 
            max-width: 1000px; 
        }
        
        /* 로그인 창 */
        .login-box { max-width: 400px; margin: 0 auto; text-align: center; }
        .login-box h2 { color: #db2777; font-size: 26px; margin-bottom: 25px; font-weight: 800; letter-spacing: 1px; }
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #701a75; margin-bottom: 6px; font-weight: 600; }
        .input-group input { 
            width: 100%; 
            padding: 13px; 
            background: #fdf4f8; 
            border: 1.5px solid #f472b6; 
            border-radius: 8px; 
            color: #1f2937; 
            font-size: 14px; 
            transition: 0.2s;
        }
        .input-group input:focus { outline: none; border-color: #db2777; background: #fff; box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1); }
        
        .btn { 
            width: 100%; 
            padding: 13px; 
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 대시보드 Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #fce7f3; padding-bottom: 18px; margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #be185d; font-weight: 800; }
        .status-badge { background: #fdf2f8; color: #be185d; border: 1px solid #f472b6; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; }

        /* 출근/퇴근 컨트롤 */
        .action-bar { display: flex; gap: 15px; margin-bottom: 30px; background: #fff1f2; padding: 18px; border-radius: 12px; border: 1px solid #fecdd3; align-items: center; justify-content: space-between; }
        .btn-clock-in { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .btn-clock-in:hover { opacity: 0.9; }
        .btn-clock-out { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); }
        .btn-clock-out:hover { opacity: 0.9; }

        /* 직급 태그 스타일 */
        .rank-badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .rank-top { background: #fce7f3; color: #9d174d; border: 1px solid #f472b6; } /* 최고위직 */
        .rank-high { background: #fff1f2; color: #be185d; border: 1px solid #fda4af; } /* 고위직 */
        .rank-mid { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; } /* 간부직 */
        .rank-normal { background: #f1f5f9; color: #475569; } /* 일반직 */
        .rank-special { background: #faf5ff; color: #7e22ce; border: 1px solid #d8b4fe; } /* 특수직 */

        /* 테이블 (출근부) */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; font-size: 14px; }
        th, td { padding: 14px; border-bottom: 1px solid #f1f5f9; }
        th { background: #fdf4f8; color: #9d174d; font-weight: 700; }
        .working-tag { color: #059669; font-weight: bold; background: #d1fae5; padding: 5px 10px; border-radius: 6px; font-size: 12px; }
        .done-tag { color: #64748b; background: #f1f5f9; padding: 5px 10px; border-radius: 6px; font-size: 12px; }
        .timer { color: #db2777; font-family: monospace; font-weight: 700; font-size: 15px; }
    </style>
</head>
<body>

<div class="card">
    <!-- 로그인 폼 -->
    <div id="loginSection" class="login-box">
        <h2>🌸 『 사 쿠 라 』 로그인</h2>
        <div class="input-group">
            <label>아이디</label>
            <input type="text" id="username" placeholder="예: pingpong 또는 admin">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="초기 비밀번호: 1234">
        </div>
        <button class="btn" onclick="login()">로그인</button>
    </div>

    <!-- 대시보드 (출근부) -->
    <div id="dashboardSection" style="display: none;">
        <div class="header">
            <h1>🌸 『 사 쿠 라 』 조직 근태 관리 대시보드</h1>
            <span class="status-badge" id="userGreeting"></span>
        </div>

        <div class="action-bar">
            <div>
                <span style="font-size: 14px; color: #64748b;">현재 접속자: </span>
                <strong id="currentUserName" style="color: #be185d;"></strong>
            </div>
            <div style="display: flex; gap: 10px; width: 260px;">
                <button class="btn btn-clock-in" onclick="clockIn()">✨ 출근하기</button>
                <button class="btn btn-clock-out" onclick="clockOut()">💤 퇴근하기</button>
            </div>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 12px; color: #831843; font-weight: 700;">📋 조직원 출근부 및 실시간 근무시간</h3>
        <table>
            <thead>
                <tr>
                    <th>분류 / 직급</th>
                    <th>이름 (ID)</th>
                    <th>날짜</th>
                    <th>출근 시간</th>
                    <th>퇴근 시간</th>
                    <th>오늘 근무 시간 (실시간)</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody id="attendanceTable">
                <!-- JavaScript로 자동 채워짐 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentUser = null;
    let timerInterval = null;

    async function login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.user;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('userGreeting').innerText = `[${currentUser.rank}] ${currentUser.name}님 환영합니다 🌸`;
            document.getElementById('currentUserName').innerText = `[${currentUser.category}] ${currentUser.rank} - ${currentUser.name}`;
            
            loadAttendance();
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(loadAttendance, 1000);
        } else {
            alert(data.message);
        }
    }

    async function clockIn() {
        if (!currentUser) return;
        const res = await fetch('/api/clock-in', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: currentUser.username, 
                name: currentUser.name,
                rank: currentUser.rank,
                category: currentUser.category 
            })
        });
        const data = await res.json();
        alert(data.message);
        loadAttendance();
    }

    async function clockOut() {
        if (!currentUser) return;
        const res = await fetch('/api/clock-out', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username })
        });
        const data = await res.json();
        alert(data.message);
        loadAttendance();
    }

    function getRankBadgeClass(category) {
        switch(category) {
            case '최고위직': return 'rank-top';
            case '고위직': return 'rank-high';
            case '간부직': return 'rank-mid';
            case '특수직': return 'rank-special';
            default: return 'rank-normal';
        }
    }

    async function loadAttendance() {
        const res = await fetch('/api/attendance-list');
        const data = await res.json();
        
        if (!data.success) return;

        const tbody = document.getElementById('attendanceTable');
        tbody.innerHTML = '';

        const now = new Date();

        data.list.forEach(row => {
            const tr = document.createElement('tr');
            
            const inTime = new Date(row.clock_in);
            const outTime = row.clock_out ? new Date(row.clock_out) : null;
            
            const endTime = outTime || now;
            const diffMs = endTime - inTime;
            const diffSec = Math.floor(diffMs / 1000);
            
            const hrs = Math.floor(diffSec / 3600);
            const mins = Math.floor((diffSec % 3600) / 60);
            const secs = diffSec % 60;
            const timeString = `${hrs}시간 ${mins}분 ${secs}초`;

            const formatTime = (d) => d ? d.toLocaleTimeString('ko-KR', { hour12: false }) : '-';
            const badgeClass = getRankBadgeClass(row.category);

            tr.innerHTML = `
                <td><span class="rank-badge ${badgeClass}">${row.category} | ${row.rank}</span></td>
                <td><strong>${row.name}</strong> <span style="color:#64748b; font-size:12px;">(${row.username})</span></td>
                <td>${row.date}</td>
                <td>${formatTime(inTime)}</td>
                <td>${formatTime(outTime)}</td>
                <td class="timer">${timeString}</td>
                <td>${outTime ? '<span class="done-tag">퇴근완료</span>' : '<span class="working-tag">🔥 근무 중</span>'}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
